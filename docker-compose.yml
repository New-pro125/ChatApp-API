name: inversify-passport

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inversify}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18 changed PGDATA; mount the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-inversify}"
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_NAME: ${POSTGRES_DB:-inversify}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "${PGBOUNCER_HOST_PORT:-6434}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 5432" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO withdrew its public Docker Hub/Quay images; this is the Bitnami
    # legacy build of the same S3-compatible server. Replace the image with
    # your own pinned registry mirror for production.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-messenger-media}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
    entrypoint:
      - /bin/sh
      - -c
      - >
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "${MINIO_BUCKET:-messenger-media}" 2>/dev/null ||
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "${MINIO_BUCKET:-messenger-media}" &&
        aws --endpoint-url http://minio:9000 s3api put-bucket-versioning --bucket "${MINIO_BUCKET:-messenger-media}" --versioning-configuration Status=Enabled
    restart: "no"

  coturn:
    image: coturn/coturn:latest
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-inversify.local}
      - --user=${TURN_USER:-turnuser}:${TURN_PASSWORD:-turnpassword}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --no-tls
    ports:
      - "${TURN_HOST_PORT:-3478}:3478/tcp"
      - "${TURN_HOST_PORT:-3478}:3478/udp"
      - "${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    profiles: [ "scan" ]
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamdb:/var/lib/clamav

  adminer:
    image: adminer:latest
    profiles: [ "tools" ]
    ports:
      - "${ADMINER_HOST_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:latest
    profiles: [ "tools" ]
    ports:
      - "${REDISINSIGHT_HOST_PORT:-5540}:5540"
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    profiles: [ "tools" ]
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdb:
